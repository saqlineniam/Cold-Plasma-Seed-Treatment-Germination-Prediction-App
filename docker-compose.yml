version: '3.8'

services:
  # The Tracking Server (Always stays up)
  mlflow-server:
    build: .
    container_name: mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
    command: >
      mlflow server 
      --backend-store-uri sqlite:////app/mlruns/mlflow.db 
      --default-artifact-root /app/mlruns 
      --host 0.0.0.0 
      --port 5000

  # The Dashboard (The new Control Center)
  streamlit-app:
    build: .
    container_name: streamlit-app
    ports:
      - "8501:8501"
    depends_on:
      - mlflow-server
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - DATA_FILE=train.xlsx
    volumes:
      - ./mlruns:/app/mlruns
      - ./outputs:/app/outputs
    command: streamlit run src/app_streamlit.py --server.port=8501 --server.address=0.0.0.0
